<!doctype html><html><head><meta charset="utf-8"><title>God's Pandora</title>
<style>
  html,body{margin:0;height:100%;background:#0e0e12;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;cursor:default}
  .card{position:relative;width:100%;height:100%;background:url(splash.jpg) center/cover no-repeat;animation:in .5s ease-out}
  .bar{position:absolute;left:46px;right:46px;bottom:14px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
  .bar i{position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,#a58bff,#ffb86b,transparent);animation:slide 1.4s ease-in-out infinite}
  .status{position:absolute;right:46px;bottom:22px;color:#8f8fa3;font-size:11px;letter-spacing:.06em}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  @keyframes in{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
</style></head><body><div class="card"><div class="status" id="s">Loading Pandora Core…</div><div class="bar"><i></i></div></div>
<script>
  const steps=['Loading Pandora Core…','Loading Pandora Studio…','Checking your GPU…','Loading models library…','Preparing your creative universe…'];
  let i=0; setInterval(()=>{i=Math.min(i+1,steps.length-1);document.getElementById('s').textContent=steps[i];},650);
</script></body></html>
