name: Build Windows

# Verifiable Windows build: the installer is produced from this repository's source on GitHub's
# runners (required by SignPath Foundation's free OSS code signing). When the SignPath secrets
# exist, the installer is sent to SignPath for signing (each release still needs a manual approval
# there) and the signed file is attached to the release. Without them, an unsigned build is kept
# as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to (leave empty to only build)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build UI
        run: npm run build:ui

      - name: Package app (win-unpacked)
        run: npx electron-builder --win dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress; }
          Copy-Item CHANGELOG.md build-assets/installer/CHANGELOG.txt -Force
          Push-Location build-assets
          & $mk /V2 installer.nsi
          Pop-Location
          Get-ChildItem release/*.exe

      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: release/Gods-Pandora-Setup-*.exe
          if-no-files-found: error

      # ---- SignPath (enabled once the project is approved and the secrets are added) ----
      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gods-pandora
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Attach installer to release
        if: env.TAG != ''
        shell: pwsh
        run: |
          $f = if ($env:HAS_SIGNPATH -eq 'true') { Get-ChildItem signed/*.exe } else { Get-ChildItem release/Gods-Pandora-Setup-*.exe }
          Write-Host "Uploading $($f.FullName) to $env:TAG"
          gh release upload $env:TAG $f.FullName --clobber -R $env:GITHUB_REPOSITORY
